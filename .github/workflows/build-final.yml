name: Build final workbook

on:
  push:
    paths:
      - 'code/main.py'
      - 'data/uci_default.xls'
      - '.github/workflows/build-final.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn statsmodels xlrd openpyxl
      - name: Run project
        run: python code/main.py
      - name: Commit final workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final/Client_Behavioral_Risk_Score.xlsx
          git diff --cached --quiet || git commit -m "Add final dashboard workbook"
          git push
