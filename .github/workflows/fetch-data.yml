name: Fetch source dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download UCI dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          import zipfile

          url = "https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip"
          data_dir = Path("data")
          data_dir.mkdir(exist_ok=True)
          zip_path = data_dir / "uci_default.zip"
          out_path = data_dir / "uci_default.xls"

          urllib.request.urlretrieve(url, zip_path)

          with zipfile.ZipFile(zip_path) as archive:
              xls_name = next(
                  name for name in archive.namelist()
                  if name.lower().endswith(".xls")
              )
              with archive.open(xls_name) as source, out_path.open("wb") as target:
                  target.write(source.read())

          zip_path.unlink()
          print(f"Saved {out_path} ({out_path.stat().st_size} bytes)")
          PY

      - name: Verify file
        run: |
          test -s data/uci_default.xls
          ls -lh data/uci_default.xls

      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uci_default.xls
          if git diff --cached --quiet; then
            echo "Dataset already up to date"
          else
            git commit -m "Add UCI source dataset"
            git push
          fi
